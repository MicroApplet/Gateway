server:
  port: ${port:80}

spring:
  application:
    name: gateway

  config:
    import:
      - optional:nacos:route.yaml
      - optional:nacos:gateway.yaml
      - optional:nacos:redis.yaml
      - optional:nacos:sensitive_enc.yaml
      - optional:nacos:feign.yaml
      - optional:nacos:log.yaml
      - optional:nacos:nacos.yaml
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: ${NACOS_URL}
        namespace: ${NACOS_NAMESPACE}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        group: ${NACOS_GROUP}
        enable-remote-sync-config: true
        refresh-enabled: true
    gateway:
      # 关键：关闭默认的路由发现，只使用显式配置的路由
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true



logging:
  level:
    com:
      alibaba:
        nacos:
          client:
            naming: error
